# Builds the signed iOS app on GitHub's Macs and uploads it to TestFlight,
# so no team laptop is needed. Signing is automatic ("cloud signing") with an
# App Store Connect API key kept in the repository's secrets:
#   ASC_KEY_ID     the key's ID (10 characters)
#   ASC_ISSUER_ID  the issuer ID shown above the keys list
#   ASC_KEY_P8     the full text of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role (Admin can use cloud-managed certificates).
#
# Start it: Actions → "iOS TestFlight" → Run workflow (once this file is on
# main), or push a tag named ios-testflight-<anything>.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in TestFlight (higher than the App Store's)
        required: true
        default: "1.1.0"
  push:
    tags: ["ios-testflight-*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version || '1.1.0' }}
      TEAM_ID: DT5487Q4KG
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect secrets
        env:
          HAS_P8: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ "$HAS_P8" = "true" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          xcodebuild -version

      # Same as the team's Mac: plugins through CocoaPods.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get

      - name: Install iOS libraries (CocoaPods)
        run: cd ios && (pod install --repo-update || pod update Firebase)

      # Without these, permission_handler answers "denied" on iPhone without
      # asking (see post_install in ios/Podfile).
      - name: Check the permission switches
        run: |
          for P in PERMISSION_SENSORS PERMISSION_MICROPHONE; do
            grep -q "$P=1" ios/Pods/Pods.xcodeproj/project.pbxproj || { echo "::error::$P=1 missing in the Pods project"; exit 1; }
          done

      - name: Write the API key to a private file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Flutter build settings (version and build number)
        run: |
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build ios --release --config-only --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      # 1) Archive without any signature (Apple issues development profiles
      #    only for registered test devices, and the iOS 26 SDK refuses
      #    "run locally" signing inside Xcode).
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # 2) Put the app's permissions (Sign in with Apple) on the binary with a
      #    placeholder signature, so the App Store signing in step 3 keeps them.
      - name: Mark the app's permissions
        run: |
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
            | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          codesign --force --sign - --timestamp=none --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q applesignin

      - name: Export options
        run: |
          for DEST in export upload; do
          cat > "$RUNNER_TEMP/ExportOptions-$DEST.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          done

      # 3) App Store signature from Apple's cloud signing (no certificate
      #    files needed), then check it before uploading anything.
      - name: Sign for the App Store and check it
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cd "$RUNNER_TEMP/export" && unzip -q -o *.ipa -d ipa
          codesign -dvv ipa/Payload/Runner.app 2>&1 | grep -E "Authority=|TeamIdentifier"
          codesign -d --entitlements - ipa/Payload/Runner.app 2>/dev/null | tee ents.txt | head -40
          grep -q applesignin ents.txt || { echo "::error::Sign in with Apple entitlement missing"; exit 1; }
          grep -q "Apple Distribution" <(codesign -dvv ipa/Payload/Runner.app 2>&1) || { echo "::error::Not signed for distribution"; exit 1; }

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded WellMate $VERSION ($BUILD_NUMBER). It appears in TestFlight after Apple's processing (about 10-30 minutes)."

      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
